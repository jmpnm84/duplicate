<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Peças por QR Code com Histórico</title>
    
    <!-- Configurações PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- SheetJS para leitura de ficheiros Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2, h3 {
            color: #2c3e50;
            margin-top: 0;
        }
        .section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eaeaea;
        }
        .section:last-child {
            border-bottom: none;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        input[type="file"], input[type="text"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 10px;
            font-size: 16px;
        }
        input[type="text"]:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 5px rgba(0,123,255,0.3);
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .btn-danger {
            background-color: #dc3545;
            float: right;
        }
        .btn-danger:hover {
            background-color: #c82333;
        }
        #statusRef {
            font-size: 14px;
            margin-top: 5px;
            color: #666;
        }
        #alertaScan {
            padding: 15px;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
        .alerta-sucesso {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alerta-erro {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f8f9fa;
        }
        .badge-success {
            color: #155724;
            background-color: #d4edda;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .badge-danger {
            color: #721c24;
            background-color: #f8d7da;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        #installContainer {
            display: none;
            background: #e2f0d9;
            border: 1px solid #c6e0b4;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Validação de Peças por QR Code (Digitalização Individual)</h2>

    <!-- Botão de Instalação PWA -->
    <div id="installContainer">
        <p style="margin: 0 0 10px 0; font-weight: bold; color: #385723;">Instale esta aplicação no seu dispositivo para acesso rápido e offline!</p>
        <button id="btnInstall" style="background-color: #385723;">Instalar Aplicação</button>
    </div>

    <!-- Secção 1: Carregar Referências -->
    <div class="section">
        <label for="excelFile">1. Carregar Ficheiro Excel (Valores de Referência):</label>
        <input type="file" id="excelFile" accept=".xlsx, .xls, .csv">
        <button onclick="processarExcel()">Importar para Base de Dados</button>
        <div id="statusRef">Estado: Base de dados de referência vazia.</div>
    </div>

    <!-- Secção 2: Campo de Digitalização (QR Code / Leitor) -->
    <div class="section">
        <label for="inputQrCode">2. Digitalizar/Ler QR Code da Peça:</label>
        <input type="text" id="inputQrCode" placeholder="Clique aqui e use o leitor (ou escreva e prima Enter)..." autofocus autocomplete="off">
        
        <!-- Caixa de aviso imediato -->
        <div id="alertaScan">Aguardando leitura...</div>
    </div>

    <!-- Secção 3: Histórico de Leituras da Sessão / Base de Dados -->
    <div class="section">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0;">3. Histórico de Peças Validadas</h3>
            <button class="btn-danger" onclick="limparHistorico()">Limpar Histórico</button>
        </div>
        <table id="tabelaHistorico">
            <thead>
                <tr>
                    <th>Data/Hora</th>
                    <th>Código da Peça</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="3" style="text-align: center; color: #888;">Nenhuma peça lida ainda.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const DB_NAME = "PecasQR_DB";
    const STORE_REF = "referencias";
    const STORE_HIST = "historico";
    let db = null;

    // Registo do Service Worker para PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker registado com sucesso:', reg.scope))
                .catch(err => console.error('Erro ao registar Service Worker:', err));
        });
    }

    // Gestão do evento de instalação PWA
    let deferredPrompt;
    const installContainer = document.getElementById("installContainer");
    const btnInstall = document.getElementById("btnInstall");

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installContainer.style.display = "block";
    });

    btnInstall.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                console.log('Utilizador aceitou instalar a PWA');
            }
            deferredPrompt = null;
            installContainer.style.display = "none";
        }
    });

    // Inicializar IndexedDB (armazena referências e histórico de leituras)
    function initDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 1);
            
            request.onerror = (event) => reject("Erro ao abrir IndexedDB");
            
            request.onsuccess = (event) => {
                db = event.target.result;
                verificarRegistosNaBD();
                carregarHistoricoDaBD();
                resolve(db);
            };
            
            request.onupgradeneeded = (event) => {
                const database = event.target.result;
                if (!database.objectStoreNames.contains(STORE_REF)) {
                    database.createObjectStore(STORE_REF, { keyPath: "codigo" });
                }
                if (!database.objectStoreNames.contains(STORE_HIST)) {
                    database.createObjectStore(STORE_HIST, { keyPath: "id", autoIncrement: true });
                }
            };
        });
    }

    // Verificar quantas referências estão guardadas
    function verificarRegistosNaBD() {
        const transaction = db.transaction(STORE_REF, "readonly");
        const store = transaction.objectStore(STORE_REF);
        const countRequest = store.count();
        
        countRequest.onsuccess = () => {
            const total = countRequest.result;
            const statusEl = document.getElementById("statusRef");
            if (total > 0) {
                statusEl.innerHTML = `Estado: <strong>${total}</strong> referências carregadas na base de dados.`;
                statusEl.style.color = "green";
            } else {
                statusEl.innerHTML = "Estado: Base de dados de referência vazia.";
                statusEl.style.color = "#666";
            }
        };
    }

    // Processar e guardar Excel no IndexedDB
    function processarExcel() {
        const fileInput = document.getElementById("excelFile");
        if (fileInput.files.length === 0) {
            alert("Por favor, selecione um ficheiro Excel primeiro.");
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                
                if (jsonRows.length === 0) {
                    alert("O ficheiro Excel parece estar vazio.");
                    return;
                }

                const transaction = db.transaction(STORE_REF, "readwrite");
                const store = transaction.objectStore(STORE_REF);
                store.clear();

                let count = 0;
                jsonRows.forEach(row => {
                    if (row[0] !== undefined && row[0] !== null && String(row[0]).trim() !== "") {
                        const codigoLimpo = String(row[0]).trim().toUpperCase();
                        store.put({ codigo: codigoLimpo });
                        count++;
                    }
                });

                transaction.oncomplete = () => {
                    alert(`Sucesso! ${count} referências importadas.`);
                    verificarRegistosNaBD();
                    document.getElementById("inputQrCode").focus();
                };

            } catch (error) {
                console.error(error);
                alert("Erro ao ler o ficheiro Excel.");
            }
        };
        reader.readAsArrayBuffer(file);
    }

    // Evento de escuta do leitor de QR Code (quando pressiona Enter ou o leitor envia a string completa)
    const inputQrCode = document.getElementById("inputQrCode");
    inputQrCode.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            const codigoLido = inputQrCode.value.trim();
            if (codigoLido !== "") {
                validarEDivergirPeca(codigoLido);
                inputQrCode.value = ""; // Limpa para a próxima leitura
            }
        }
    });

    // Validar peça lida individualmente contra a BD e guardar no histórico
    function validarEDivergirPeca(codigo) {
        if (!db) {
            alert("Base de dados ainda não inicializada.");
            return;
        }

        const codigoLimpo = codigo.toUpperCase();
        const transaction = db.transaction(STORE_REF, "readonly");
        const store = transaction.objectStore(STORE_REF);
        const request = store.get(codigoLimpo); // Busca direta na chave primária (muito rápido)

        request.onsuccess = () => {
            const existe = !!request.result; // true se encontrou, false se não
            
            // Mostrar aviso visual imediato
            mostrarAlertaVisual(codigoLimpo, existe);

            // Guardar no Histórico da Base de Dados
            guardarHistoricoItem(codigoLimpo, existe);
        };
    }

    // Exibir alerta grande no ecrã
    function mostrarAlertaVisual(codigo, existe) {
        const alerta = document.getElementById("alertaScan");
        alerta.style.display = "block";
        
        if (existe) {
            alerta.className = "alerta-sucesso";
            alerta.innerHTML = `✅ PEÇA LISTADA: ${codigo} (Encontrada na referência)`;
        } else {
            alerta.className = "alerta-erro";
            alerta.innerHTML = `❌ PEÇA NÃO LISTADA: ${codigo} (EM FALTA!)`;
        }
    }

    // Guardar item individual no histórico do IndexedDB
    function guardarHistoricoItem(codigo, existe) {
        const transaction = db.transaction(STORE_HIST, "readwrite");
        const store = transaction.objectStore(STORE_HIST);

        const novoRegisto = {
            data: new Date().toLocaleString(),
            codigo: codigo,
            estado: existe ? "Listado" : "Não Listado"
        };

        store.add(novoRegisto);

        transaction.oncomplete = () => {
            carregarHistoricoDaBD();
        };
    }

    // Carregar e listar o histórico da BD na tabela
    function carregarHistoricoDaBD() {
        const tbody = document.querySelector("#tabelaHistorico tbody");
        const transaction = db.transaction(STORE_HIST, "readonly");
        const store = transaction.objectStore(STORE_HIST);
        const request = store.getAll();

        request.onsuccess = () => {
            const historico = request.result;
            if (historico.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #888;">Nenhuma peça lida ainda.</td></tr>';
                return;
            }

            tbody.innerHTML = "";
            // Mostra do mais recente para o mais antigo
            historico.reverse().forEach(item => {
                const tr = document.createElement("tr");

                const tdData = document.createElement("td");
                tdData.textContent = item.data;

                const tdPeca = document.createElement("td");
                tdPeca.textContent = item.codigo;

                const tdEstado = document.createElement("td");
                if (item.estado === "Listado") {
                    tdEstado.innerHTML = '<span class="badge-success">Listado</span>';
                } else {
                    tdEstado.innerHTML = '<span class="badge-danger">Não Listado</span>';
                }

                tr.appendChild(tdData);
                tr.appendChild(tdPeca);
                tr.appendChild(tdEstado);
                tbody.appendChild(tr);
            });
        };
    }

    // Limpar o histórico completo
    function limparHistorico() {
        if (confirm("Tem a certeza que deseja limpar todo o histórico de leituras?")) {
            const transaction = db.transaction(STORE_HIST, "readwrite");
            const store = transaction.objectStore(STORE_HIST);
            store.clear();

            transaction.oncomplete = () => {
                carregarHistoricoDaBD();
                document.getElementById("alertaScan").style.display = "none";
                document.getElementById("inputQrCode").focus();
            };
        }
    }

    // Inicializar a BD ao carregar a página
    window.onload = () => {
        initDB().catch(err => console.error(err));
    };
</script>

</body>
</html>
